name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test -- --watch=false

      # ng build already exits non-zero on a budget error. The grep also
      # fails the check on budget warnings and any other warning the
      # builder reports, which it prints as "[WARNING]". NO_COLOR keeps
      # that tag free of ANSI codes; Node runtime warnings do not match.
      - name: Build
        env:
          NO_COLOR: 1
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -q '\[WARNING\]' build.log; then
            echo '::error::The production build emitted warnings'
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: browser
          path: dist/facturath/browser
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs the wrangler version pinned in package-lock.json; the
      # action uses that install instead of downloading another one.
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: browser
          path: dist/facturath/browser

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

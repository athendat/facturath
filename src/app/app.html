<div class="app-top" data-print-hide>
  <header class="app-header">
    <span class="wordmark">FACTURATH</span>
    <span class="reference">{{ store.headerReference() }}</span>
    <div class="actions">
      <button type="button" class="secondary" (click)="save()">Guardar</button>
      <button type="button" class="secondary" (click)="startNew()">Nueva</button>
      <button type="button" class="secondary" (click)="drawerOpen.set(true)">
        Guardadas ({{ saved.count() }})
      </button>
      <button type="button" class="primary" (click)="printer.print()">PDF / Imprimir</button>
    </div>
  </header>
  <app-toast-host
    [toast]="toasts.current()"
    (actionClicked)="toasts.runAction()"
    (dismissed)="toasts.dismiss()"
  />
  <app-toast-host [toast]="storageNotice()" />
</div>
<main class="app-main">
  <app-invoice-editor />
</main>
<footer class="app-footer" data-print-hide>
  FACTURATH es gratis y funciona sin conexión. Para contabilidad completa, conoce
  <a href="https://balanc.athendat.site" target="_blank" rel="noopener">BALANC</a>.
</footer>
<app-saved-invoices-drawer [(open)]="drawerOpen" (opened)="openSaved($event)" data-print-hide />

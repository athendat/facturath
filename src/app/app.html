<div class="app-top" data-print-hide>
  <header class="app-header">
    <span class="wordmark">FACTURATH</span>
    <span class="reference wide-only">{{ store.headerReference() }}</span>
    <!-- One row for both widths: below 960px the seal and the Más menu give way to the
         hamburger, Guardar keeps only its icon and PDF / Imprimir shortens to PDF (#61). -->
    <div class="actions">
      <app-compliance-seal
        class="wide-only"
        [pending]="store.pendingCount()"
        (activated)="complianceOpen.set(true)"
      />
      <span class="divider wide-only" aria-hidden="true"></span>
      <button type="button" class="secondary save" (click)="save()">
        <app-icon name="save" />
        <span class="save-label">Guardar</span>
      </button>
      <button type="button" class="primary" (click)="printer.print()">
        <app-icon name="print" />
        PDF<span class="wide-only"> / Imprimir</span>
      </button>
      <app-menu-button class="wide-only" label="Más" [items]="moreItems()" (chosen)="run($event)" />
      <button
        type="button"
        class="icon-button hamburger"
        [attr.aria-label]="menuLabel()"
      >
        <app-icon name="menu" />
        <!-- The phone header has no seal, so the hamburger carries the count: as a badge for
             the eye and in its accessible name for a screen reader. -->
        @if (store.pendingCount() > 0) {
          <span class="badge" aria-hidden="true">{{ store.pendingCount() }}</span>
        }
      </button>
    </div>
  </header>
  <app-toast-host
    [toast]="toasts.current()"
    (actionClicked)="toasts.runAction()"
    (dismissed)="toasts.dismiss()"
  />
  <app-toast-host [toast]="storageNotice()" />
</div>
<main class="app-main">
  <app-invoice-editor />
</main>
<footer class="app-footer" data-print-hide>
  FACTURATH es gratis y funciona sin conexión. Para contabilidad completa, conoce
  <a href="https://balanc.athendat.site" target="_blank" rel="noopener">BALANC</a>.
</footer>
<!-- Each panel is its own chunk, fetched the first time it opens (the service worker prefetches
     them for offline use), so the initial bundle stays under budget (#41). -->
@defer (when drawerOpen()) {
  <app-saved-invoices-drawer [(open)]="drawerOpen" (opened)="openSaved($event)" data-print-hide />
}
@defer (when settingsOpen()) {
  <app-settings-panel [(open)]="settingsOpen" />
}
@defer (when complianceOpen()) {
  <app-compliance-panel [(open)]="complianceOpen" />
}
@defer (when fileOpen()) {
  <app-file-panel [(open)]="fileOpen" [invoice]="store.invoice()" (imported)="onImported($event)" />
}
